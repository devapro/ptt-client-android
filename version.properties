# Single source of truth for the app version.
#
# The release workflow refuses to publish a tag that disagrees with this file, and F-Droid
# builds a plain checkout with no Gradle properties set - so this has to be right in the commit
# the tag points at, not only in CI.
#
# versionCode is derived: major*10000 + minor*100 + patch.
versionName=1.0.0
