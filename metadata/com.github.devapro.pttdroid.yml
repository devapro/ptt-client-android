Categories:
  - Connectivity
License: GPL-3.0-only
AuthorName: devapro
WebSite: https://devapro.github.io/ptt-client-android/
SourceCode: https://github.com/devapro/ptt-client-android
IssueTracker: https://github.com/devapro/ptt-client-android/issues
Changelog: https://github.com/devapro/ptt-client-android/releases

AutoName: PTTdroid

RepoType: git
Repo: https://github.com/devapro/ptt-client-android.git

Builds:
  - versionName: 1.0.0
    versionCode: 10000
    commit: v1.0.0
    subdir: app
    gradle:
      - yes

MaintainerNotes: |-
  versionName and versionCode are not literals in app/build.gradle.kts: they are read at build
  time from version.properties at the repository root (versionCode is derived as
  major*10000 + minor*100 + patch). parse_androidmanifests() therefore returns Unknown/None,
  which is why UpdateCheckData is set - versionName comes from version.properties and
  versionCode from the recipe the upstream repository keeps in sync with it.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: metadata/com.github.devapro.pttdroid.yml|CurrentVersionCode:\s*(\d+)|version.properties|versionName=([0-9.]+)
CurrentVersion: 1.0.0
CurrentVersionCode: 10000
