# Publishes the project site: the landing page from docs/.
#
# This used to assemble a second half — an F-Droid repository kept on an fdroid-repo branch — into
# the same deployment. That repository was removed; the app is distributed through the official
# F-Droid catalogue instead, so the site is now just the landing page. docs/fdroid.md records why.
#
# ONE-TIME SETUP: Settings -> Pages -> Source must be "GitHub Actions", not "Deploy from a
# branch". While it is set to a branch, this workflow's deployments are ignored.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deployments at once, and never cancel one in flight — a half-written site is worse
# than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the landing page
        run: |
          mkdir -p site
          cp -r docs/. site/
          # Pages runs Jekyll over the artifact otherwise, which drops files beginning with "_".
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
