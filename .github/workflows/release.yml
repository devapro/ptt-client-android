# Tag-driven release: a signed APK attached to the GitHub release.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag must match version.properties. It is checked rather than derived, because F-Droid
# builds a plain checkout of the tagged commit with no properties passed in — a version that
# only existed in CI would build as something else entirely.
#
# This workflow does NOT publish an F-Droid repository. Distribution to F-Droid goes through the
# official catalogue, which builds from source and signs with F-Droid's own key, so nothing here
# signs an index. The self-hosted repository this repo used to publish was removed deliberately;
# docs/fdroid.md records why and what it would take to bring it back.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#
#   ANDROID_KEYSTORE_BASE64     base64 of the app signing keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# The app key must outlive every release: Android refuses an update signed with a different one.
# See docs/fdroid.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Signed APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against version.properties
        id: version
        run: |
          set -euo pipefail
          name="$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')"
          if [ -z "$name" ]; then
            echo "::error::version.properties has no versionName"
            exit 1
          fi

          # major*10000 + minor*100 + patch, matching app/build.gradle.kts.
          IFS='.' read -r major minor patch <<< "${name%%-*}"
          code=$(( major * 10000 + minor * 100 + patch ))

          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$name" ]; then
              echo "::error::tag v$tag does not match version.properties ($name). F-Droid builds the tagged commit as-is, so these must agree."
              exit 1
            fi
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Releasing $name (versionCode $code)"

      - name: Require a changelog for this version
        run: |
          file="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt"
          if [ ! -s "$file" ]; then
            echo "::error::$file is missing or empty — F-Droid shows it as the release notes."
            exit 1
          fi

      # The official catalogue reads this release's version code out of the recipe's
      # CurrentVersionCode, not out of the Gradle files: versionCode is derived from
      # version.properties at build time, so F-Droid's parse_androidmanifests() finds no literal
      # to grep and the recipe's UpdateCheckData points back at this file instead. A stale
      # CurrentVersionCode is therefore silent — the tag builds, the release ships, and
      # f-droid.org simply never sees it. Checked here for the same reason the tag is.
      - name: Check the F-Droid recipe against version.properties
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}" <<'PY'
          import sys, yaml

          want_name, want_code = sys.argv[1], int(sys.argv[2])
          path = 'metadata/com.github.devapro.pttdroid.yml'
          recipe = yaml.safe_load(open(path))
          errors = []

          if str(recipe.get('CurrentVersion')) != want_name:
              errors.append(f"CurrentVersion is {recipe.get('CurrentVersion')!r}, expected {want_name!r}")
          if recipe.get('CurrentVersionCode') != want_code:
              errors.append(f"CurrentVersionCode is {recipe.get('CurrentVersionCode')!r}, expected {want_code}")

          # F-Droid builds the Builds entry whose commit is this tag, so one has to be there,
          # has to agree, and must not be disabled.
          builds = recipe.get('Builds') or []
          entries = [b for b in builds if b.get('versionCode') == want_code]
          if not entries:
              present = ', '.join(str(b.get('versionCode')) for b in builds) or 'none'
              errors.append(f"no Builds entry with versionCode {want_code} (present: {present})")
          else:
              build = entries[-1]
              want_commit = 'v' + want_name
              if str(build.get('versionName')) != want_name:
                  errors.append(f"the Builds entry's versionName is {build.get('versionName')!r}, expected {want_name!r}")
              if build.get('commit') != want_commit:
                  errors.append(f"the Builds entry's commit is {build.get('commit')!r}, expected {want_commit!r}")
              if build.get('disable'):
                  errors.append(f"the Builds entry is disabled: {build['disable']!r}")

          for e in errors:
              print(f"::error file={path}::{e}")
          if errors:
              print("::error::the F-Droid recipe disagrees with version.properties, so"
                    " f-droid.org would not see this release. See docs/fdroid.md.")
              raise SystemExit(1)
          print(f"{path} agrees: {want_name} ({want_code})")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # The same gate as CI. A tag must not be able to skip it.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Lint
        run: ./gradlew lintDebug

      - name: Decode the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # All four are checked here, not just the keystore. An unset secret arrives as an empty
          # string rather than an error, and app/build.gradle.kts reads the other three straight
          # out of the environment - so the build otherwise runs on for another 90 seconds and
          # dies in :app:packageRelease with
          #   Failed to read key  from store ".../release.jks": keystore password was incorrect
          # which names neither the missing secret nor the empty key alias. This actually
          # happened on the v1.0.0 tag.
          missing=
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::not set:$missing. A release must be signed; see docs/fdroid.md."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble the release APK
        env:
          PTT_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          PTT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PTT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PTT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify the APK is signed and carries the expected version
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::no signed APK at $apk — the signing config did not apply."
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk"

          # Gradle's own output metadata, rather than aapt badging: it is exact, and it does not
          # depend on which build-tools the runner happens to ship.
          python3 - "${{ steps.version.outputs.code }}" "${{ steps.version.outputs.name }}" <<'PY'
          import json, sys
          want_code, want_name = int(sys.argv[1]), sys.argv[2]
          el = json.load(open('app/build/outputs/apk/release/output-metadata.json'))['elements'][0]
          assert el['versionCode'] == want_code, (el['versionCode'], want_code)
          assert el['versionName'] == want_name, (el['versionName'], want_name)
          print(f"APK reports {el['versionName']} ({el['versionCode']})")
          PY

      # Named for the application id and version code rather than "app-release.apk", so a
      # downloaded file still says what it is once it is out of the browser.
      - name: Name the APK for release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/com.github.devapro.pttdroid_${{ steps.version.outputs.code }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach the APK to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt

