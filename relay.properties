# The relay a fresh install dials while Settings → Relay is left on "Default".
#
# Read at build time into BuildConfig, the way version.properties is read into versionName:
# F-Droid builds a plain checkout with no Gradle properties set, so anything that only exists
# in CI would build as whatever the fallback happened to be. Override it for a one-off build
# with -PpttDefaultRelay=... or PTT_DEFAULT_RELAY=... in the environment.
#
# Format: scheme://host:port. Both the scheme and the port are required — nothing is inferred
# here, so what a build ships is exactly what is written on this line. ws:// leaves the
# encryption switch off on a fresh install, wss:// turns it on.
#
# 10.0.2.2 is the emulator's route to the machine running it; localhost inside an emulator is
# the emulator itself. That makes the shipped default useful for development and useless on a
# real handset, which is the honest state of things while there is no public relay to point at.
# Fork this app for a group with its own relay and this is the one line to change.
defaultRelay=wss://ptt-server-salg.onrender.com:443
