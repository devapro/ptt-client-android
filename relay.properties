# The relay a fresh install dials while Settings → Relay is left on "Default".
#
# Read at build time into BuildConfig, the way version.properties is read into versionName:
# F-Droid builds a plain checkout with no Gradle properties set, so anything that only exists
# in CI would build as whatever the fallback happened to be. Override it for a one-off build
# with -PpttDefaultRelay=... or PTT_DEFAULT_RELAY=... in the environment.
#
# Format: scheme://host:port. Both the scheme and the port are required — nothing is inferred
# here, so what a build ships is exactly what is written on this line. ws:// leaves the
# encryption switch off on a fresh install, wss:// turns it on.
#
# What is shipped below points at the machine running the relay, so a fresh install never sends
# voice to a server nobody chose: the app is self-hosted, and nothing goes through anyone else's
# servers unless a fork or the user puts one here or in Settings → Relay → Custom. On a real
# handset this reaches nothing until the relay is set to a server the user runs.
#
# For local development, point it at the machine running the relay instead. From an emulator that
# address is 10.0.2.2 — localhost inside an emulator is the emulator itself — so
# ws://10.0.2.2:8000 is the usual value, and PTT_DEFAULT_RELAY= sets it for one build without
# editing this file.
defaultRelay=ws://10.0.2.2:8000
